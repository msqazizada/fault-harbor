name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Analyze Go code
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/... ./internal/...
      - name: Check formatting and frontend
        run: make fmt-check lint-web test-web
      - name: Test Go with race detection and coverage
        run: make coverage
      - name: Scan for known vulnerabilities
        run: make security
      - run: make build
      - run: docker build -t faultharbor:ci .
      - name: Verify Docker inspection fixtures
        run: make test-integration
        env:
          FAULTHARBOR_TEST_IMAGE: faultharbor:ci
      - name: Upload Go coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
