version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  # An explicit set keeps tool upgrades from silently adding unrelated rules.
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - nilerr
    - noctx
    - nolintlint
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
